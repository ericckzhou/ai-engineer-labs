# [provided] Scope pytest to the offline tests/ suite only.
# `python_files = test_*.py` (not the default `test_*.py *_test.py`) means
# client_smoke_test.py is NOT collected — it imports the `mcp` SDK and is the live
# end-to-end path, not an offline unit test.
[pytest]
testpaths = tests
python_files = test_*.py
