[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Project-based AI engineering learning lab"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ipython>=8.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
